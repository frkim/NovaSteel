[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novasteel-workloads"
version = "0.1.0"
description = "NovaSteel pillar workloads (P1–P4) — decision-support models packaged for Fabric."
requires-python = ">=3.11"
dependencies = [
    "novasteel-core>=0.1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
genai = ["openai>=1.30"]
milp = ["pulp>=2.7"]
contentsafety = ["azure-identity>=1.16", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["."]
include = ["workloads*"]

[tool.pytest.ini_options]
# Run the full Python suite from the repo root: contracts, medallion transforms and workloads.
filterwarnings = [
    "ignore::DeprecationWarning:pulp",
    "ignore::DeprecationWarning:pulp.pulp",
    "ignore::DeprecationWarning:pulp.apis.coin_api",
]
testpaths = [
    "libs/novasteel_core/tests",
    "platform/medallion/tests",
    "platform/kpi/tests",
    "platform/governance/tests",
    "workloads",
]
