name: Scheduled Fabric batch refresh

# Cost-controlled batch: resume + bump the Fabric capacity to F4, promote the medallion and
# score the pillars off the live eventhouse, then ALWAYS pause + resize back to F2. Fabric bills
# nothing while paused, so this keeps standing cost at zero between runs.
#
# Manual by default; enable the cron once the OIDC secrets + deployed notebooks are in place.
# Requires repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * *"   # 03:00 UTC daily

permissions:
  contents: read
  id-token: write

env:
  CAPACITY_ID: /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-novasteel-dev/providers/Microsoft.Fabric/capacities/fabnovasteedevox26fi

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Azure login (OIDC, no secrets/keys)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Python deps
        run: python3 -m pip install -e libs/novasteel_core requests

      - name: Resume + bump capacity to F4
        run: |
          az rest --method post --uri "https://management.azure.com${CAPACITY_ID}/resume?api-version=2023-11-01" || true
          az rest --method patch --uri "https://management.azure.com${CAPACITY_ID}?api-version=2023-11-01" \
            --headers "Content-Type=application/json" --body '{"sku":{"name":"F4","tier":"Fabric"}}'
          for i in $(seq 1 18); do
            state=$(az resource show --ids "$CAPACITY_ID" --query "properties.state" -o tsv)
            echo "state=$state"; [ "$state" = "Active" ] && break; sleep 10
          done

      - name: Run medallion + pillar batch
        env:
          KUSTO_URI: https://trd-ambx6f52vhyf6840ak.z1.kusto.fabric.microsoft.com
        run: |
          export FABRIC_TOKEN=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          export ONELAKE_TOKEN=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          export KUSTO_TOKEN=$(az account get-access-token --resource "$KUSTO_URI" --query accessToken -o tsv)
          python3 platform/scripts/run_gold_marts_live.py
          python3 platform/scripts/validate_pillars_live.py --skip-deploy P1

      - name: Always pause + resize to F2 (stop cost)
        if: always()
        run: |
          az rest --method post --uri "https://management.azure.com${CAPACITY_ID}/suspend?api-version=2023-11-01" || true
          for i in $(seq 1 18); do
            state=$(az resource show --ids "$CAPACITY_ID" --query "properties.state" -o tsv)
            [ "$state" = "Paused" ] && break; sleep 10
          done
          az rest --method patch --uri "https://management.azure.com${CAPACITY_ID}?api-version=2023-11-01" \
            --headers "Content-Type=application/json" --body '{"sku":{"name":"F2","tier":"Fabric"}}'
