name: Steel factory simulator

on:
  push:
    paths:
      - "apps/steel_factory_simulator/**"
      - "libs/NovaSteel.Contracts/**"
      - "NovaSteel.slnx"
      - ".github/workflows/simulator.yml"
  pull_request:
    paths:
      - "apps/steel_factory_simulator/**"
      - "libs/NovaSteel.Contracts/**"
      - "NovaSteel.slnx"
      - ".github/workflows/simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore simulator
        run: dotnet restore apps/steel_factory_simulator/tests/SteelFactorySimulator.Tests/SteelFactorySimulator.Tests.csproj

      - name: Build simulator
        run: dotnet build apps/steel_factory_simulator/tests/SteelFactorySimulator.Tests/SteelFactorySimulator.Tests.csproj --configuration Release --no-restore

      - name: Test simulator
        run: dotnet test apps/steel_factory_simulator/tests/SteelFactorySimulator.Tests/SteelFactorySimulator.Tests.csproj --configuration Release --no-build

  # Build the simulator image server-side in ACR and push :latest + :<sha>.
  # Manual (workflow_dispatch) and requires federated OIDC secrets:
  #   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_NAME (e.g. acrnovasteedevox26fi).
  build-push-image:
    needs: build-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image to ACR
        uses: azure/cli@965c8d7571d2231a54e321ddd07f7b10317f34d9 # v2.1.0
        with:
          azcliversion: 2.76.0
          inlineScript: |
            az acr build \
              --registry "${{ secrets.ACR_NAME }}" \
              --image "steel-factory-simulator:latest" \
              --image "steel-factory-simulator:${{ github.sha }}" \
              --file apps/steel_factory_simulator/Dockerfile .
