[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novasteel-core"
version = "0.1.0"
description = "Shared NovaSteel telemetry & market contracts (Python parity of NovaSteel.Contracts)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["novasteel_core*"]
